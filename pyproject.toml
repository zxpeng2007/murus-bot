[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palisade-bot"
version = "1.0.0"
description = "Write an engine for the wall game and put it on the Palisade ladder: rules, API client and play loop."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "zxpeng2007" }]
requires-python = ">=3.11"
keywords = ["quoridor", "palisade", "board-game", "bot", "game-ai"]
dependencies = [
    "httpx>=0.27",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://murus.net"
Source = "https://github.com/zxpeng2007/palisade-bot"
"Fair play" = "https://murus.net/#/fairplay"

[tool.setuptools.packages.find]
include = ["palisade_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` finds the package in a fresh clone, with or without an install.
pythonpath = ["."]
